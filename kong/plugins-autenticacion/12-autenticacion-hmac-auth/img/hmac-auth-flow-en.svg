<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">HMAC Auth flow in Kong Gateway</title>
  <desc id="desc">The client signs a canonical string. Kong rebuilds the signature, checks the date, and either rejects the request or identifies the Consumer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#fffdf8"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 125 L600 205" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 303 L600 375" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M850 440 L920 440" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 505 L600 595" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 705 L600 785" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="390" y="25" width="420" height="95" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="64.805" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Client</text>
    <text x="600" y="98.555" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">canonical string + secret</text>
    <rect x="400" y="210" width="400" height="88" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="263.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Kong Gateway</text>
    <rect x="355" y="380" width="490" height="120" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="432.305" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">HMAC Auth plugin</text>
    <text x="600" y="466.055" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">rebuilds signature and checks date</text>
    <rect x="925" y="395" width="230" height="90" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1040" y="448.5" text-anchor="middle" font-size="25" font-weight="600" fill="#b91c1c" stroke="none">401 Unauthorized</text>
    <rect x="380" y="600" width="440" height="100" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="600" y="659.18" text-anchor="middle" font-size="27" font-weight="600" fill="#15803d" stroke="none">Consumer identified</text>
    <rect x="400" y="790" width="400" height="90" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="600" y="844.18" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9" stroke="none">Upstream service</text>
    <text x="625" y="150" font-size="20" fill="#1e293b" stroke="none">Authorization: hmac</text>
    <text x="625" y="174" font-size="20" fill="#1e293b" stroke="none">signature + headers</text>
    <text x="855" y="418" font-size="20" fill="#b91c1c" stroke="none">Invalid</text>
    <text x="630" y="550" font-size="20" fill="#15803d" stroke="none">Valid signature</text>
  </g>
</svg>
