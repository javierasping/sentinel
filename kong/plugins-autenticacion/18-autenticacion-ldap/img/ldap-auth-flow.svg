<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de LDAP Auth en Kong Gateway</title>
  <desc id="desc">Kong decodifica las credenciales, construye el DN y realiza un bind contra LDAP. Un bind válido permite llegar al upstream y uno inválido devuelve 401.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#fffdf8"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 111 L600 180" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 278 L550 345" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M775 395 L865 395" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M865 440 L775 440" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M325 445 L180 555" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M550 470 L600 750" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="450" y="30" width="300" height="76" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="77.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Cliente</text>
    <rect x="400" y="185" width="400" height="88" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="238.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Kong Gateway</text>
    <rect x="330" y="350" width="440" height="115" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="550" y="399.805" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Plugin LDAP Auth</text>
    <text x="550" y="433.555" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">decodifica y construye DN</text>
    <rect x="870" y="350" width="290" height="115" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="1015" y="400.66" text-anchor="middle" font-size="24" font-weight="600" fill="#c2410c" stroke="none">Directorio LDAP</text>
    <text x="1015" y="430.66" text-anchor="middle" font-size="24" font-weight="600" fill="#c2410c" stroke="none">bind de usuario</text>
    <rect x="55" y="560" width="250" height="92" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="180" y="614.5" text-anchor="middle" font-size="25" font-weight="600" fill="#b91c1c" stroke="none">401 Unauthorized</text>
    <rect x="400" y="755" width="400" height="92" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="600" y="810.18" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9" stroke="none">Servicio upstream</text>
    <text x="625" y="125" font-size="20" fill="#1e293b" stroke="none">Authorization: ldap</text>
    <text x="625" y="149" font-size="20" fill="#1e293b" stroke="none">usuario:contraseña</text>
    <text x="800" y="330" font-size="20" fill="#c2410c" stroke="none">1  bind</text>
    <text x="790" y="500" font-size="20" fill="#c2410c" stroke="none">2  éxito o error</text>
    <text x="185" y="485" font-size="20" fill="#b91c1c" stroke="none">Bind inválido</text>
    <text x="625" y="590" font-size="20" fill="#15803d" stroke="none">Bind válido</text>
    <text x="625" y="614" font-size="20" fill="#15803d" stroke="none">elimina credenciales</text>
  </g>
</svg>
