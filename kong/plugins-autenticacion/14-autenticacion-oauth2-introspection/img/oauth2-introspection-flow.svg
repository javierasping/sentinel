<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de introspección OAuth 2.0 en Kong</title>
  <desc id="desc">Kong recibe un access token y consulta a Keycloak. Solo envía la petición al upstream cuando la respuesta de introspección contiene active igual a true.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#fffdf8"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M325 118 L445 118" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M755 105 L875 105" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M875 145 L755 145" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 166 L600 315" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M385 390 L250 555" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M815 390 L940 555" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="75" width="280" height="86" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
    <text x="180" y="127.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Cliente</text>
    <rect x="450" y="75" width="300" height="86" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="127.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Kong Gateway</text>
    <rect x="880" y="75" width="280" height="86" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="1020" y="127.18" text-anchor="middle" font-size="27" font-weight="600" fill="#c2410c" stroke="none">Keycloak</text>
    <rect x="390" y="320" width="420" height="110" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="349.5" text-anchor="middle" font-size="24" font-weight="600" fill="#1e293b" stroke="none">Plugin abierto de la comunidad</text>
    <text x="600" y="379.5" text-anchor="middle" font-size="24" font-weight="600" fill="#1e293b" stroke="none">o código libre · oidc</text>
    <text x="600" y="409.5" text-anchor="middle" font-size="24" font-weight="600" fill="#1e293b" stroke="none">interpreta active</text>
    <rect x="80" y="560" width="250" height="92" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="205" y="614.5" text-anchor="middle" font-size="25" font-weight="600" fill="#b91c1c" stroke="none">401 Unauthorized</text>
    <rect x="780" y="560" width="330" height="92" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="945" y="615.18" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9" stroke="none">Servicio echo</text>
    <text x="335" y="50" font-size="20" fill="#1e293b" stroke="none">1  Bearer</text>
    <text x="755" y="25" font-size="20" fill="#1e293b" stroke="none">2  introspección</text>
    <text x="755" y="49" font-size="20" fill="#1e293b" stroke="none">cliente Basic</text>
    <text x="755" y="190" font-size="20" fill="#c2410c" stroke="none">3  active: true|false</text>
    <text x="625" y="230" font-size="20" fill="#1e293b" stroke="none">4  resultado</text>
    <text x="275" y="465" font-size="20" fill="#b91c1c" stroke="none">active=false</text>
    <text x="850" y="465" font-size="20" fill="#15803d" stroke="none">active=true</text>
  </g>
</svg>
