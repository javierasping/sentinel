<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Session and Key Auth flow in Kong</title>
  <desc id="desc">Kong restores a valid session or uses an API key to create one. Requests without a session or valid key end at the anonymous Consumer with a 403.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#fffdf8"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 105 L600 170" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M370 230 L245 385" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M830 230 L935 385" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M935 495 L825 585" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1115 495 L1095 585" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M245 495 L500 795" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M825 695 L600 795" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="450" y="25" width="300" height="75" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="71.68" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Client</text>
    <rect x="375" y="175" width="450" height="100" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="217.305" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Session plugin</text>
    <text x="600" y="251.055" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">valid cookie?</text>
    <rect x="70" y="390" width="350" height="100" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="245" y="433.16" text-anchor="middle" font-size="24" font-weight="600" fill="#15803d" stroke="none">Restores Consumer</text>
    <text x="245" y="463.16" text-anchor="middle" font-size="24" font-weight="600" fill="#15803d" stroke="none">and credential</text>
    <rect x="760" y="390" width="350" height="100" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="935" y="433.16" text-anchor="middle" font-size="24" font-weight="600" fill="#1e293b" stroke="none">Key Auth plugin</text>
    <text x="935" y="463.16" text-anchor="middle" font-size="24" font-weight="600" fill="#1e293b" stroke="none">valid API key?</text>
    <rect x="650" y="590" width="350" height="100" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="825" y="648.16" text-anchor="middle" font-size="24" font-weight="600" fill="#15803d" stroke="none">Creates session cookie</text>
    <rect x="1010" y="590" width="170" height="100" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1095" y="633.16" text-anchor="middle" font-size="24" font-weight="600" fill="#b91c1c" stroke="none">403</text>
    <text x="1095" y="663.16" text-anchor="middle" font-size="24" font-weight="600" fill="#b91c1c" stroke="none">Forbidden</text>
    <rect x="340" y="800" width="420" height="90" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="550" y="854.18" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9" stroke="none">Upstream service</text>
    <text x="625" y="130" font-size="20" fill="#1e293b" stroke="none">cookie or apikey</text>
    <text x="235" y="300" font-size="20" fill="#15803d" stroke="none">Valid cookie</text>
    <text x="835" y="300" font-size="20" fill="#1e293b" stroke="none">No session</text>
    <text x="820" y="530" font-size="20" fill="#15803d" stroke="none">Valid API key</text>
    <text x="1115" y="535" font-size="20" fill="#b91c1c" stroke="none">Invalid</text>
    <text x="300" y="650" font-size="20" fill="#15803d" stroke="none">Continues</text>
    <text x="670" y="740" font-size="20" fill="#15803d" stroke="none">Set-Cookie</text>
  </g>
</svg>
