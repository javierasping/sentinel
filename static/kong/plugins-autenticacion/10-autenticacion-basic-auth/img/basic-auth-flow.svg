<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de Basic Authentication en Kong Gateway</title>
  <desc id="desc">El cliente envía credenciales Basic a Kong Gateway. El plugin Basic Auth rechaza las credenciales inválidas con un 401 o identifica al Consumer cuando son válidas y permite llegar al upstream.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#fffdf8"/>

  <g font-family="Comic Sans MS, Segoe Print, cursive" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Client -->
    <rect x="450" y="35" width="300" height="76" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="83" text-anchor="middle" font-size="30" font-weight="600" stroke="none">Cliente</text>

    <!-- Client to Kong -->
    <path d="M600 112 C598 132 602 145 600 168" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="625" y="137" font-size="22" stroke="none">Authorization:</text>
    <text x="625" y="163" font-size="22" stroke="none">Basic &lt;credentials&gt;</text>

    <!-- Kong Gateway -->
    <rect x="400" y="190" width="400" height="92" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="246" text-anchor="middle" font-size="30" font-weight="600" stroke="none">Kong Gateway</text>

    <!-- Gateway to plugin -->
    <path d="M600 284 C598 304 602 318 600 342" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <!-- Basic Auth plugin -->
    <rect x="400" y="360" width="400" height="100" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="420" text-anchor="middle" font-size="29" font-weight="600" stroke="none">Plugin Basic Auth</text>

    <!-- Invalid branch -->
    <path d="M800 410 C848 409 878 410 926 410" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="850" y="390" text-anchor="middle" font-size="23" fill="#b91c1c" stroke="none">Invalid</text>
    <rect x="930" y="365" width="230" height="90" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1045" y="420" text-anchor="middle" font-size="28" font-weight="600" fill="#991b1b" stroke="none">401 Unauthorized</text>

    <!-- Valid branch -->
    <path d="M600 462 C598 484 602 500 600 526" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="630" y="505" font-size="23" fill="#15803d" stroke="none">Valid</text>

    <!-- Consumer -->
    <rect x="400" y="545" width="400" height="100" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="600" y="605" text-anchor="middle" font-size="29" font-weight="600" fill="#166534" stroke="none">Consumidor identificado</text>

    <!-- Consumer to upstream -->
    <path d="M600 647 C598 671 602 694 600 718" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <rect x="400" y="735" width="400" height="92" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="600" y="791" text-anchor="middle" font-size="30" font-weight="600" fill="#5b21b6" stroke="none">Servicio upstream</text>
  </g>
</svg>
