<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de JWT Auth en Kong Gateway</title>
  <desc id="desc">Kong extrae el JWT, localiza la credencial por iss y valida algoritmo, firma y expiración antes de identificar al Consumer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#fffdf8"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 111 L600 180" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 278 L600 340" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M855 407 L920 407" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 475 L600 565" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 675 L600 765" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="450" y="30" width="300" height="76" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="77.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Cliente</text>
    <rect x="400" y="185" width="400" height="88" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="238.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Kong Gateway</text>
    <rect x="350" y="345" width="500" height="125" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="399.805" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Plugin JWT</text>
    <text x="600" y="433.555" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">iss + algoritmo + firma + exp</text>
    <rect x="925" y="362" width="230" height="90" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1040" y="415.5" text-anchor="middle" font-size="25" font-weight="600" fill="#b91c1c" stroke="none">401 Unauthorized</text>
    <rect x="380" y="570" width="440" height="100" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="600" y="629.18" text-anchor="middle" font-size="27" font-weight="600" fill="#15803d" stroke="none">Consumer identificado</text>
    <rect x="400" y="770" width="400" height="92" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="600" y="825.18" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9" stroke="none">Servicio upstream</text>
    <text x="625" y="125" font-size="20" fill="#1e293b" stroke="none">Authorization:</text>
    <text x="625" y="149" font-size="20" fill="#1e293b" stroke="none">Bearer &lt;JWT&gt;</text>
    <text x="855" y="385" font-size="20" fill="#b91c1c" stroke="none">Inválido</text>
    <text x="630" y="520" font-size="20" fill="#15803d" stroke="none">Token válido</text>
  </g>
</svg>
