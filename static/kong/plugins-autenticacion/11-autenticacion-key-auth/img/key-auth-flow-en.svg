<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Key Auth flow in Kong Gateway</title>
  <desc id="desc">Kong receives an API key, validates it, rejects unknown keys or identifies the Consumer, removes the credential, and proxies the request upstream.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#fffdf8"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 106 L600 180" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 276 L600 340" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M825 397 L920 397" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 455 L600 540" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 655 L600 745" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="450" y="30" width="300" height="76" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="77.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Client</text>
    <rect x="400" y="185" width="400" height="88" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="238.18" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Kong Gateway</text>
    <rect x="380" y="345" width="440" height="105" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
    <text x="600" y="389.805" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">Key Auth plugin</text>
    <text x="600" y="423.555" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b" stroke="none">looks up credential</text>
    <rect x="925" y="352" width="230" height="90" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1040" y="405.5" text-anchor="middle" font-size="25" font-weight="600" fill="#b91c1c" stroke="none">401 Unauthorized</text>
    <rect x="380" y="545" width="440" height="105" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="600" y="606.68" text-anchor="middle" font-size="27" font-weight="600" fill="#15803d" stroke="none">Consumer identified</text>
    <rect x="400" y="750" width="400" height="92" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="600" y="805.18" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9" stroke="none">Upstream service</text>
    <text x="625" y="140" font-size="20" fill="#1e293b" stroke="none">apikey: &lt;key&gt;</text>
    <text x="845" y="375" font-size="20" fill="#b91c1c" stroke="none">Invalid</text>
    <text x="630" y="500" font-size="20" fill="#15803d" stroke="none">Valid</text>
    <text x="630" y="690" font-size="20" fill="#1e293b" stroke="none">Removes apikey</text>
    <text x="630" y="714" font-size="20" fill="#1e293b" stroke="none">adds identity</text>
  </g>
</svg>
